name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Avoids accidental network calls from any test that forgot to clear it.
  ANTHROPIC_API_KEY: ""

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --features 'rustls-tls,streaming,tools,bedrock,vertex' -- -D warnings

  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-default-features
            flags: --no-default-features
          - label: default
            flags: ""
          - label: bedrock
            flags: --features bedrock
          # `--all-features` would activate `live-tests`, which requires a real
          # ANTHROPIC_API_KEY. Enumerate every feature except `live-tests` instead.
          - label: all-except-live
            flags: --no-default-features --features rustls-tls,streaming,tools,bedrock,vertex
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: cargo test
        run: cargo test --locked ${{ matrix.flags }}

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: doc

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features 'rustls-tls,streaming,tools,bedrock,vertex'

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        if: ${{ hashFiles('deny.toml') != '' }}
        run: cargo deny check
